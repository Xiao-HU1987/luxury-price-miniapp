/* ========================================

:root {

  --color-text-primary:   #2C2C2C;
  --color-text-secondary: #6B6B6B;
  --color-text-tertiary:  #9E9E9E;
  --color-text-inverse:   #FFFFFF;

  --color-accent:          #C8553D;
  --color-accent-light:    #E8765F;
  --color-accent-pale:     #FFF0ED;
  --color-accent-dark:     #A3422F;

  --color-gold:            #C5A47E;
  --color-gold-light:      #E8D5B7;
  --color-gold-dark:       #9E835A;

  --color-border:          #E8E4E0;
  --color-border-light:    #F0ECE8;
  --color-divider:         #ECECEC;

  --color-success:         #4CAF50;
  --color-danger:          #E53935;
  --color-flag-cn:         #DE2910;
  --color-flag-jp:         #C8553D;

  /* ---- Typography ---- */
  --font-sans:  'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;

  --text-xs:    0.625rem;   /* 10px */
  --text-sm:    0.75rem;    /* 12px */
  --text-base:  0.875rem;   /* 14px */
  --text-md:    1rem;       /* 16px */
  --text-lg:    1.125rem;   /* 18px */
  --text-xl:    1.25rem;    /* 20px */
  --text-2xl:   1.5rem;     /* 24px */
  --text-3xl:   1.875rem;   /* 30px */

  --leading-tight:  1.25;
  --leading-normal: 1.5;
  --leading-loose:  1.75;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide:   0.02em;

  /* ---- Spacing ---- */
  --space-1:  0.25rem;  /* 4px */
  --space-2:  0.5rem;   /* 8px */
  --space-3:  0.75rem;  /* 12px */
  --space-4:  1rem;     /* 16px */
  --space-5:  1.25rem;  /* 20px */
  --space-6:  1.5rem;   /* 24px */
  --space-8:  2rem;     /* 32px */
  --space-10: 2.5rem;   /* 40px */
  --space-12: 3rem;     /* 48px */

  /* ---- Border Radius ---- */
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --radius-full: 9999px;

  /* ---- Shadows ---- */
  --shadow-sm:   0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md:   0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-lg:   0 4px 16px rgba(0, 0, 0, 0.1);
  --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.06);

  /* ---- Transitions ---- */
  --transition-fast:   150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow:   350ms ease;

  /* ---- Z-index ---- */
  --z-tab-bar: 100;
  --z-nav-bar: 200;
  --z-overlay: 300;
  --z-modal:   400;
}

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Mobile Frame */
      .mobile-frame {
        width: 375px;
        min-height: 812px;
        margin: 0 auto;
        background-color: var(--color-bg);
        position: relative;
        overflow: hidden;
      }

      /* Nav Bar */
      .nav-bar {
        position: sticky;
        top: 0;
        z-index: var(--z-nav-bar);
        background-color: var(--color-bg);
        border-bottom: 1px solid var(--color-border-light);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 52px;
      }

      .nav-back {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 24px;
        color: var(--color-text-primary);
        text-decoration: none;
        line-height: 1;
        cursor: pointer;
      }

      .nav-title {
        font-size: var(--text-md);
        font-weight: 600;
        color: var(--color-text-primary);
        letter-spacing: var(--tracking-tight);
      }

      .nav-count {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
      }

      /* Product Card */
      .product-card {
        background-color: var(--color-bg);
        border-bottom: 1px solid var(--color-divider);
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background-color var(--transition-fast);
      }

      .product-card:last-of-type {
        border-bottom: none;
      }

      .product-card:active {
        background-color: var(--color-bg-secondary);
      }

      .product-img-placeholder {
        width: 72px;
        height: 72px;
        min-width: 72px;
        border-radius: var(--radius-md);
        background-color: var(--color-bg-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }

      .product-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
      }

      .product-brand {
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        letter-spacing: var(--tracking-wide);
        text-transform: uppercase;
      }

      .product-name {
        font-size: var(--text-base);
        font-weight: 600;
        color: var(--color-text-primary);
        line-height: var(--leading-tight);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .product-article {
        font-size: var(--text-xs);
        color: var(--color-accent);
        letter-spacing: var(--tracking-wide);
      }

      .product-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        min-width: 80px;
        height: 72px;
        padding-top: 2px;
      }

      .product-heart {
        font-size: 18px;
        color: var(--color-accent);
        line-height: 1;
        cursor: pointer;
      }

      .product-price {
        font-size: var(--text-sm);
        font-weight: 700;
        color: var(--color-accent);
        letter-spacing: var(--tracking-tight);
      }

      /* Hint */
      .swipe-hint {
        text-align: center;
        font-size: var(--text-xs);
        color: var(--color-text-tertiary);
        padding: 24px 16px 32px;
      }
    </style>
</body>
